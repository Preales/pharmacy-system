<div class="flex justify-center items-center min-h-screen bg-surface-100">
  <p-card styleClass="w-full max-w-md text-center p-6">
    <div class="flex flex-col align-items-center gap-4">
      <i class="pi pi-lock text-red-500" style="font-size: 4rem;"></i>
      <h1 i18n="@@unauthorized.title" class="text-3xl font-bold text-surface-900 m-0">Access Denied</h1>
      <p i18n="@@unauthorized.message" class="text-surface-600 m-0">
        You do not have permission to access this page.
        Please contact your administrator if you believe this is an error.
      </p>
      <div class="flex gap-2 mt-2">
        <a routerLink="/catalog">
          <p-button label="Go to Catalog" i18n-label="@@unauthorized.goToCatalog" icon="pi pi-home" severity="secondary" />
        </a>
        <a routerLink="/sales/pos">
          <p-button label="Go to POS" i18n-label="@@unauthorized.goToPos" icon="pi pi-shopping-cart" />
        </a>
      </div>
    </div>
  </p-card>
</div>
