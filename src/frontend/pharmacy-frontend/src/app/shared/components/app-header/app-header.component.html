<header class="app-header">
  <div class="app-header__brand">
    <span class="pi pi-heart app-header__brand-icon"></span>
    <span class="app-header__tenant" title="Tenant">{{ tenantDisplay }}</span>
  </div>

  <div class="app-header__actions">
    <span class="app-header__email">{{ userEmail }}</span>

    <button
      class="app-header__lang-toggle"
      type="button"
      [attr.aria-label]="'lang.toggle' | translate"
      (click)="toggleLanguage()"
    >
      {{ toggleLangLabel }}
    </button>

    <button
      class="app-header__theme-toggle"
      type="button"
      [attr.aria-label]="(themeService.isDarkMode() ? 'theme.toggleLight' : 'theme.toggleDark') | translate"
      (click)="toggleTheme()"
    >
      <i
        class="pi"
        [class.pi-sun]="themeService.isDarkMode()"
        [class.pi-moon]="!themeService.isDarkMode()"
      ></i>
    </button>
  </div>
</header>
