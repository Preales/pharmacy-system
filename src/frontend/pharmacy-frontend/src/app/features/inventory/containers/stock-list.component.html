<p-toast />

<div class="page-header">
  <h2>Stock Levels</h2>
  <div class="header-actions">
    <p-button label="Record Ingress" icon="pi pi-arrow-down" (onClick)="openIngress()" />
    <p-button label="Adjustment" icon="pi pi-pencil" severity="secondary" (onClick)="openAdjustment()" />
  </div>
</div>

<div class="filter-bar">
  <input
    pInputText
    [(ngModel)]="searchTerm"
    placeholder="Search by product name or SKU..."
    (ngModelChange)="onSearchChange()"
    class="filter-input"
  />
  <p-button
    icon="pi pi-refresh"
    severity="secondary"
    [text]="true"
    (onClick)="resetSearch()"
    pTooltip="Clear search"
  />
</div>

<p-table
  [value]="inventoryService.items().items"
  [loading]="inventoryService.loading()"
  [lazy]="true"
  [paginator]="true"
  [rows]="pageSize"
  [totalRecords]="inventoryService.items().totalCount"
  (onPage)="onPage($event)"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="{first}–{last} of {totalRecords}"
  [rowsPerPageOptions]="[10, 20, 50]"
  styleClass="p-datatable-striped"
  dataKey="productId"
>
  <ng-template pTemplate="header">
    <tr>
      <th>Product Name</th>
      <th>SKU</th>
      <th>Category</th>
      <th style="text-align:right">Current Stock</th>
      <th style="text-align:right">Threshold</th>
      <th>Status</th>
      <th style="width: 110px">Actions</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-item>
    <tr [class]="item.status === 'Critical' ? 'row-critical' : item.status === 'Low' ? 'row-low' : ''">
      <td>{{ item.productName }}</td>
      <td><code>{{ item.sku }}</code></td>
      <td>{{ item.categoryName }}</td>
      <td style="text-align:right" class="font-semibold">{{ item.currentStock }}</td>
      <td style="text-align:right" class="text-secondary">{{ item.lowStockThreshold }}</td>
      <td>
        <p-tag
          [value]="getStatusLabel(item.status)"
          [severity]="getStatusSeverity(item.status)"
        />
      </td>
      <td>
        <p-button
          icon="pi pi-list"
          [rounded]="true"
          [text]="true"
          severity="info"
          pTooltip="View Movements"
          (onClick)="viewMovements(item)"
        />
        <p-button
          icon="pi pi-arrow-down"
          [rounded]="true"
          [text]="true"
          severity="success"
          pTooltip="Record Ingress"
          (onClick)="openIngressFor(item)"
        />
      </td>
    </tr>
  </ng-template>

  <ng-template pTemplate="empty">
    <tr>
      <td colspan="7" class="text-center p-4">No stock items found.</td>
    </tr>
  </ng-template>
</p-table>

<app-ingress-form
  [(visible)]="ingressVisible"
  [preselectedProductId]="preselectedProductId()"
  (saved)="onIngressSaved()"
/>
<app-adjustment-form
  [(visible)]="adjustmentVisible"
  (saved)="onAdjustmentSaved()"
/>
