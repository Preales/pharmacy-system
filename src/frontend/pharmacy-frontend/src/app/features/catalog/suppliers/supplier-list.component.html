<p-toast />
<p-confirmDialog />

<div class="page-header">
  <h2 i18n="@@suppliers.pageTitle">Suppliers</h2>
  <p-button label="New Supplier" i18n-label="@@suppliers.newBtn" icon="pi pi-plus" (onClick)="openCreate()" />
</div>

<div class="search-bar">
  <span class="p-input-icon-left">
    <i class="pi pi-search"></i>
    <input pInputText [(ngModel)]="searchTerm" placeholder="Search suppliers..." i18n-placeholder="@@suppliers.searchPlaceholder" class="w-full" />
  </span>
</div>

<p-table
  [value]="filtered()"
  [loading]="supplierService.loading()"
  [paginator]="true"
  [rows]="10"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="{first}–{last} of {totalRecords}"
  i18n-currentPageReportTemplate="@@table.pageReport"
  [rowsPerPageOptions]="[10, 25, 50]"
  styleClass="p-datatable-striped"
>
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="name" i18n="@@suppliers.col.name">Name <p-sortIcon field="name" /></th>
      <th i18n="@@suppliers.col.contact">Contact</th>
      <th i18n="@@suppliers.col.email">Email</th>
      <th i18n="@@suppliers.col.phone">Phone</th>
      <th pSortableColumn="isActive" i18n="@@suppliers.col.status">Status <p-sortIcon field="isActive" /></th>
      <th i18n="@@suppliers.col.actions" style="width: 120px">Actions</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-sup>
    <tr>
      <td>{{ sup.name }}</td>
      <td>{{ sup.contactName ?? '—' }}</td>
      <td>{{ sup.contactEmail ?? '—' }}</td>
      <td>{{ sup.phone ?? '—' }}</td>
      <td>
        <p-tag [value]="sup.isActive ? 'Active' : 'Inactive'" [severity]="sup.isActive ? 'success' : 'danger'" />
      </td>
      <td>
        <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" severity="info" (onClick)="openEdit(sup)" />
        <p-button icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger" (onClick)="confirmDelete(sup)" />
      </td>
    </tr>
  </ng-template>

  <ng-template pTemplate="empty">
    <tr><td colspan="6" i18n="@@suppliers.empty" class="text-center p-4">No suppliers found.</td></tr>
  </ng-template>
</p-table>

<app-supplier-form
  [(visible)]="formVisible"
  [editTarget]="editTarget()"
  (saved)="onSaved()"
/>
