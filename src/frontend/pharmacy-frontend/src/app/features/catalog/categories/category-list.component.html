<p-toast />
<p-confirmDialog />

<div class="page-header">
  <h2 i18n="@@categories.pageTitle">Categories</h2>
  <p-button label="New Category" i18n-label="@@categories.newBtn" icon="pi pi-plus" (onClick)="openCreate()" />
</div>

<div class="search-bar">
  <span class="p-input-icon-left">
    <i class="pi pi-search"></i>
    <input
      pInputText
      [(ngModel)]="searchTerm"
      placeholder="Search categories..."
      i18n-placeholder="@@categories.searchPlaceholder"
      class="w-full"
    />
  </span>
</div>

<p-table
  [value]="filtered()"
  [loading]="categoryService.loading()"
  [paginator]="true"
  [rows]="10"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="{first}–{last} of {totalRecords}"
  i18n-currentPageReportTemplate="@@table.pageReport"
  [rowsPerPageOptions]="[10, 25, 50]"
  styleClass="p-datatable-striped"
>
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="name" i18n="@@categories.col.name">Name <p-sortIcon field="name" /></th>
      <th i18n="@@categories.col.description">Description</th>
      <th pSortableColumn="isActive" i18n="@@categories.col.status">Status <p-sortIcon field="isActive" /></th>
      <th i18n="@@categories.col.actions" style="width: 120px">Actions</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-cat>
    <tr>
      <td>{{ cat.name }}</td>
      <td>{{ cat.description ?? '—' }}</td>
      <td>
        <p-tag
          [value]="cat.isActive ? 'Active' : 'Inactive'"
          [severity]="cat.isActive ? 'success' : 'danger'"
        />
      </td>
      <td>
        <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" severity="info" (onClick)="openEdit(cat)" />
        <p-button icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger" (onClick)="confirmDelete(cat)" />
      </td>
    </tr>
  </ng-template>

  <ng-template pTemplate="empty">
    <tr><td colspan="4" i18n="@@categories.empty" class="text-center p-4">No categories found.</td></tr>
  </ng-template>
</p-table>

<app-category-form
  [(visible)]="formVisible"
  [editTarget]="editTarget()"
  (saved)="onSaved()"
/>
