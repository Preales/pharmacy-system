services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "Dev@12345"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Dev@12345" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: src/backend/src/PharmacySystem.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=PharmacyDb;User=sa;Password=Dev@12345;TrustServerCertificate=true"
      Jwt__Secret: "CHANGE-THIS-TO-A-SECURE-KEY-IN-PRODUCTION-MIN-32-CHARS!!"
      Jwt__Issuer: "PharmacySystem"
      Jwt__Audience: "PharmacySystem"
      Cors__Origins__0: "http://localhost:4200"
    ports:
      - "5000:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080'"]
      interval: 15s
      timeout: 5s
      retries: 3
      
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: src/frontend/pharmacy-frontend/Dockerfile
      target: production
    image: gentleman-ai-frontend
    ports:
      - "4200:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  sqldata:
